name: NK Müzik CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build Audit & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Klonla
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradlew Çalıştırma İzni Ver
        run: chmod +x gradlew

      - name: Birim Testleri Çalıştır
        run: ./gradlew test --stacktrace

      - name: Debug APK Derle
        run: ./gradlew assembleDebug --stacktrace

      - name: Derlenen APK'yı Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NKMuzik-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
